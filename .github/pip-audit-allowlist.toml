# Reviewed pip-audit findings for the legacy package (pyproject.toml), which the
# old dashboard image installs with `pip install -e .`.
#
# .github/scripts/pip_audit_gate.py fails CI when:
#   - pip-audit reports a finding that is not listed here (new vulnerability);
#   - a listed finding is no longer reported (it was fixed: delete the entry);
#   - review_by has passed (re-check every entry, then move the date).
#
# Add an entry only when the fixed version cannot be installed, and say why the
# vulnerable code is not reachable from Plato. Never add a blanket ignore.

review_by = "2027-02-19"

[blockers]
openai-pin = """cmbagent (required by plato.idea, method, experiment and the dashboard's \
cmbagent executor) needs cmbagent-autogen 0.0.91.post11, its newest release, which pins \
openai==1.99.9; futurehouse-client 0.7.1, its newest release, needs openai<1.100. Every \
fixed litellm (>=1.81) and langchain-openai (>=1.0) needs openai>=2, and langchain-core 1.x, \
langgraph>=1.0.10 (via langgraph-prebuilt>=1.0.8), langgraph-checkpoint 4.x and \
langgraph-sdk>=0.3 all follow from langchain-core 1.x. Lifts when cmbagent and \
futurehouse-client allow openai 2.x, or when they leave the dashboard image."""
no-fix = "No fixed release exists upstream."

