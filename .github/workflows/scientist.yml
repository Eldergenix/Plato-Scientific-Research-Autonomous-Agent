name: scientist

on:
  pull_request:
    branches: [main]
    paths:
      - "plato/scientist/**"
      - "tests/scientist/**"
      - "evals/scientist/**"
      - "cloudflare/plato-scientist/**"
      - "docker/*scientist*"
      - "pyproject.toml"
      - ".github/workflows/scientist.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: plato
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      PLATO_POSTGRES_DSN: postgresql://postgres:plato@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Exactly the container image's dependency set (docker/requirements-scientist.txt),
          # not the package's own deps, which pin an older langgraph.
          pip install -r docker/requirements-scientist.txt pytest==9.2.0 pytest-asyncio==1.5.0
      - name: Dual-graph store, guardrails, end-to-end campaign
        # The repo-wide tests/conftest.py imports modules the container does not ship.
        run: PYTHONPATH=. pytest tests/scientist -q --tb=short --confcutdir=tests/scientist

  lint:
    # Hard gate for the deployed code. The repo-wide lint workflow also covers the legacy
    # package, whose backlog keeps it red; this one must stay green.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.9
      - run: ruff check plato/scientist plato/publish evals/scientist tests/scientist --output-format=github
      - run: ruff format --check plato/scientist plato/publish evals/scientist tests/scientist

  audit:
    # The dependency set the deployed container installs (docker/Dockerfile.scientist). Any
    # known vulnerability fails: bump the pin in docker/requirements-scientist.txt.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r docker/requirements-scientist.txt --desc on

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/plato-scientist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # Every Playwright and API suite in cloudflare/plato-scientist/e2e against wrangler dev, the
    # Python service, local Postgres and stubbed Anthropic and Composio APIs (no keys needed).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      PANDOC_VERSION: "3.1.3"
      PANDOC_SHA256: caa7e0410f9e2cb1da2eb8db13cc97b5548fe455985e2c944e3929d22f99bcdc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: LaTeX, poppler and pandoc (as in docker/Dockerfile.scientist)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client poppler-utils lmodern \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          echo "${PANDOC_SHA256}  /tmp/pandoc.deb" | sha256sum -c -
          sudo dpkg -i /tmp/pandoc.deb
      - name: Python service
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -r docker/requirements-scientist.txt
      - name: Worker and browser
        working-directory: cloudflare/plato-scientist
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: End-to-end suites
        working-directory: cloudflare/plato-scientist
        env:
          PLATO_E2E_PYTHON: /tmp/venv/bin/python
          PLATO_E2E_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: e2e/run-all.sh "$RUNNER_TEMP/e2e"
      - name: Screenshots and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/e2e
          retention-days: 14
          if-no-files-found: ignore
